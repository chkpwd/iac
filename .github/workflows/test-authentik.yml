---
name: Test Functionality
on:
  workflow_dispatch:
    inputs:
      client_id:
        description: "Client ID"
        required: true
permissions:
  contents: read
  id-token: write
jobs:
  lint:
    name: Test Functionality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Get authentik token
        id: authentik-token
        uses: goauthentik/configure-authentik-credentials@26ddaf5362494a88585b1aa719c3618dc4ec35b2 # v1.2.0
        with:
          authentik_url: https://authentik.chkpwd.com
          client_id: ${{ github.event.inputs.client_id }}
      - name: Use the token
        run: |
          echo ${{ steps.authentik-token.outputs.token }}
