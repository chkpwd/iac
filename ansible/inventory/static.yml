---
all:
  hosts:
    localhost:
      ansible_connection: local
  children:
    proxmox:
      hosts:
        pve-srv-01:
          ansible_user: root
    linux:
      hosts:
        mgmt-srv-01:
        ai-inference-01:
        pve-srv-01:
        gs-srv-01:
    windows:
      hosts:
        chk-gaming-01:
      vars:
        ansible_become_method: runas
    docker_hosts:
      hosts:
        mgmt-srv-01:
        gs-srv-01:
    game_servers:
      hosts:
        gs-srv-01:
      vars:
        ansible_user: root
    printers:
      hosts:
        print-srv-01:
      vars:
        ansible_user: pi
        ansible_become_user: pi
    switches:
      hosts:
        mk-sw-01:
          ansible_host: 10.0.10.57
      vars:
        ansible_connection: local
        # Local connection: force the venv's Python (the one running ansible-playbook)
        # so the mikrotik-swos module is importable instead of Homebrew's system Python.
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
    cloud:
      children:
        aws:
