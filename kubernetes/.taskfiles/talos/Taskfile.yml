---
# yml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  TALOS_DIR: "{{.K8S_DIR}}/talos"
  CLUSTERCONFIG: "{{.K8S_DIR}}/talos/clusterconfig"

env:
  TOPFCONFIG: "{{.K8S_DIR}}/talos/topf.yaml"

tasks:
  render:
    desc: Render Talos machine configs with topf
    dir: "{{.TALOS_DIR}}"
    preconditions:
      - which topf talosctl
      - test -f "{{.TALOS_DIR}}/topf.yaml"
    cmds:
      - topf render --output "{{.CLUSTERCONFIG}}" {{.CLI_ARGS}}

  validate:
    desc: Validate rendered machine configs (topf does not validate on its own)
    dir: "{{.TALOS_DIR}}"
    deps: [render]
    cmds:
      - for: {var: FILES}
        cmd: talosctl validate --mode metal --config "{{.ITEM}}"
    vars:
      FILES:
        sh: ls {{.CLUSTERCONFIG}}/*.yaml

  apply:
    desc: Apply config to the whole cluster via topf [CLI_ARGS="--dry-run"]
    dir: "{{.TALOS_DIR}}"
    preconditions:
      - which topf
      - test -f "{{.TALOS_DIR}}/topf.yaml"
    cmds:
      - topf apply {{.CLI_ARGS}}

  apply-node:
    desc: Apply config to a single node [NODE=<hostname>] [CLI_ARGS="--dry-run"]
    dir: "{{.TALOS_DIR}}"
    requires:
      vars: [NODE]
    cmds:
      # topf --nodes-filter matches the declared hostname (regex), not the IP
      - topf --nodes-filter "{{.NODE}}" apply {{.CLI_ARGS}}

  upgrade:
    desc: Upgrade Talos on the whole cluster to topf.yaml talosVersion
    dir: "{{.TALOS_DIR}}"
    cmds:
      - topf upgrade {{.CLI_ARGS}}

  upgrade-node:
    desc: Upgrade Talos on a single node [NODE=<hostname>]
    dir: "{{.TALOS_DIR}}"
    requires:
      vars: [NODE]
    cmds:
      - topf --nodes-filter "{{.NODE}}" upgrade {{.CLI_ARGS}}

  kubeconfig:
    desc: Generate a temporary admin kubeconfig via topf
    dir: "{{.TALOS_DIR}}"
    cmds:
      - topf kubeconfig {{.CLI_ARGS}}

  secrets:
    desc: Get or (re)generate the Talos secrets bundle
    dir: "{{.TALOS_DIR}}"
    cmds:
      - topf secrets {{.CLI_ARGS}}
