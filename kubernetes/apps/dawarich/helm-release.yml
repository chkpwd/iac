---
# yaml-language-server: $schema=https://chkpwd.github.io/iac/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dawarich
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: bjw-s-labs
        namespace: flux-system
  values:
    controllers:
      dawarich:
        type: deployment
        annotations:
          reloader.stakater.com/auto: "true"
        defaultContainerOptionsStrategy: merge
        defaultContainerOptions:
          envFrom: &envFrom
            - secretRef:
                name: dawarich
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
        containers:
          app:
            image: &image
              repository: docker.io/freikin/dawarich
              tag: 1.13.1
            command: ["web-entrypoint.sh"]
            args: ["bin/rails", "server", "-p", "3000", "-b", "::"]
            env: &env
              RAILS_ENV: production
              SELF_HOSTED: "true"
              STORE_GEODATA: "true"
              RAILS_LOG_TO_STDOUT: "true"
              TIME_ZONE: America/New_York
              APPLICATION_PROTOCOL: https
              APPLICATION_HOSTS: dawarich.chkpwd.com
              REDIS_URL: redis://dawarich-redis.tools.svc.cluster.local:6379
              DATABASE_PORT: "5432"
              PROMETHEUS_EXPORTER_ENABLED: "false"
              DATABASE_HOST:
                valueFrom:
                  secretKeyRef:
                    name: dawarich-pguser-dawarich
                    key: host
              DATABASE_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: dawarich-pguser-dawarich
                    key: user
              DATABASE_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: dawarich-pguser-dawarich
                    key: password
              DATABASE_NAME:
                valueFrom:
                  secretKeyRef:
                    name: dawarich-pguser-dawarich
                    key: dbname
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: 3000
                    # App forces SSL (APPLICATION_PROTOCOL=https); without this
                    # header the probe gets a 301->https and fails the TLS
                    # handshake against plaintext Puma. Tell Rails it's secure.
                    httpHeaders:
                      - name: X-Forwarded-Proto
                        value: https
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
              readiness: *probes
              startup:
                enabled: false
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 2Gi
      sidekiq:
        type: deployment
        annotations:
          reloader.stakater.com/auto: "true"
        defaultContainerOptionsStrategy: merge
        defaultContainerOptions:
          envFrom: *envFrom
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
        containers:
          app:
            image: *image
            command: ["sidekiq-entrypoint.sh"]
            args: ["sidekiq"]
            env:
              <<: *env
              BACKGROUND_PROCESSING_CONCURRENCY: "5"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["pgrep", "-f", "sidekiq"]
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness:
                enabled: false
              startup:
                enabled: false
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 2Gi
      redis:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/valkey/valkey
              tag: 9.1.2
            command:
              - valkey-server
              - --save
              - "60"
              - "1"
              - --loglevel
              - warning
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1999
        runAsGroup: 1999
        fsGroup: 1999
        fsGroupChangePolicy: OnRootMismatch
    service:
      dawarich:
        controller: dawarich
        ports:
          http:
            port: 3000
      redis:
        controller: redis
        ports:
          http:
            port: 6379
    route:
      private:
        kind: HTTPRoute
        hostnames: ["{{ .Release.Name }}.chkpwd.com"]
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: dawarich
                port: 3000
        parentRefs:
          - name: private
            namespace: networking
            sectionName: https
    persistence:
      storage:
        type: nfs
        server: nas-srv-01.chkpwd.com
        path: /volume1/vault-01/static_media/documents/dawarich/storage
        advancedMounts:
          dawarich:
            app:
              - path: /var/app/storage
          sidekiq:
            app:
              - path: /var/app/storage
      watched:
        type: nfs
        server: nas-srv-01.chkpwd.com
        path: /volume1/vault-01/static_media/documents/dawarich/watched
        advancedMounts:
          dawarich:
            app:
              - path: /var/app/tmp/imports/watched
          sidekiq:
            app:
              - path: /var/app/tmp/imports/watched
      public:
        type: emptyDir
        advancedMounts:
          dawarich:
            app:
              - path: /var/app/public
          sidekiq:
            app:
              - path: /var/app/public
      redis-data:
        type: emptyDir
        advancedMounts:
          redis:
            app:
              - path: /data
      tmp:
        type: emptyDir
