---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/common-4.5.0/charts/library/common/values.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: searxng
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 5.0.1
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: bjw-s-labs
        namespace: flux-system
  values:
    controllers:
      searxng:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          config-yampl:
            image:
              repository: ghcr.io/clevyr/yampl
              tag: 0.9.1
            command:
              - sh
              - -c
              - exec yampl --strip /config/settings.yml > /etc/searxng/settings.yml
            envFrom:
              - secretRef:
                  name: searxng
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: [ALL]}
        containers:
          app:
            image:
              repository: ghcr.io/searxng/searxng
              tag: 2026.8.14-094c33d40
            env:
              TZ: America/New_York
              UWSGI_WORKERS: "1"
            probes:
              liveness: &probe
                enabled: true
                type: HTTP
                path: /healthz
              readiness: *probe
              startup:
                <<: *probe
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: [ALL]}
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 977
            runAsGroup: 977
            fsGroup: 977
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: RuntimeDefault}
      valkey:
        containers:
          app:
            image:
              repository: docker.io/valkey/valkey
              tag: 9.1.0
            command:
              - valkey-server
              - --save
              - "30"
              - "1"
              - --loglevel
              - warning
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: [ALL]}
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 128Mi
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1999
            runAsGroup: 1999
            fsGroup: 1999
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: RuntimeDefault}
    service:
      searxng:
        controller: searxng
        ports:
          http:
            port: 8080
      valkey:
        controller: valkey
        ports:
          http:
            port: 6379
    persistence:
      config:
        type: configMap
        name: searxng-config
        advancedMounts:
          searxng:
            config-yampl:
              - path: /config
      tmp:
        type: emptyDir
        advancedMounts:
          searxng:
            config-yampl:
              - path: /etc/searxng
                subPath: etc/searxng
            app:
              - path: /tmp
                subPath: tmp
              - path: /etc/searxng
                subPath: etc/searxng
      valkey-data:
        type: emptyDir
        advancedMounts:
          valkey:
            app:
              - path: /data
    route:
      private:
        kind: HTTPRoute
        hostnames: ["{{ .Release.Name }}.chkpwd.com"]
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: searxng
                port: 8080
        parentRefs:
          - name: private
            namespace: networking
            sectionName: https
