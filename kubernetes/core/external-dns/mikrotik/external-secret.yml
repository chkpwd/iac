---
# yaml-language-server: $schema=https://chkpwd.github.io/iac/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mikrotik
spec:
  refreshInterval: 3h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: mikrotik-external-dns
    template:
      engineVersion: v2
      data:
        MIKROTIK_BASEURL: "https://10.0.10.1"
        MIKROTIK_USERNAME: "admin"
        MIKROTIK_PASSWORD: "{{ .mikrotik_password }}"
        MIKROTIK_SKIP_TLS_VERIFY: "true"
  dataFrom:
    - extract:
        key: "infra-network-secrets"
