# Machine / node-scoped configuration.
machine:
  certSANs:
    - 127.0.0.1
  network:
    interfaces:
      - interface: enp0s31f6
        dhcp: true
        vip:
          ip: 10.0.10.13
        vlans:
          - vlanId: 20
            dhcp: false
            addresses: []
          - vlanId: 30
            dhcp: false
            addresses: []
  files:
    - op: create
      path: /etc/cri/conf.d/20-customization.part
      content: |-
        [plugins."io.containerd.cri.v1.images"]
          discard_unpacked_layers = false
        # https://github.com/kubevirt/containerized-data-importer/blob/main/doc/block_cri_ownership_config.md
        [plugins."io.containerd.cri.v1.runtime"]
          device_ownership_from_security_context = true
    - op: overwrite
      path: /etc/nfsmount.conf
      permissions: 0o644
      content: |
        [ NFSMount_Global_Options ]
        nfsvers=4.2
        hard=True
        noatime=True
        nconnect=16
  sysctls:
    fs.inotify.max_user_instances: 8192
    fs.inotify.max_user_watches: 1048576
    net.core.rmem_max: 67108864
    net.core.wmem_max: 67108864
    net.core.default_qdisc: fq
    net.ipv4.tcp_congestion_control: bbr
    user.max_user_namespaces: "11255"
  udev:
    rules:
      - SUBSYSTEM=="drm", KERNEL=="renderD*", GROUP="44", MODE="0660" # Intel GPU
  features:
    kubernetesTalosAPIAccess:
      enabled: true
      allowedRoles:
        - os:admin
      allowedKubernetesNamespaces:
        - actions-runner-system
        - tuppr
---
apiVersion: v1alpha1
kind: KubeletConfig
config:
  maxPods: 150
  serializeImagePulls: false
  imageGCHighThresholdPercent: 70
  imageGCLowThresholdPercent: 50
---
apiVersion: v1alpha1
kind: KubeNodeConfig
nodeIP:
  validSubnets:
    - 10.0.10.0/24
labels:
  intel.feature.node.kubernetes.io/gpu: "true"
taints:
  node-role.kubernetes.io/control-plane:
    $patch: delete # allow workloads on control-plane nodes
---
apiVersion: v1alpha1
kind: ResolverConfig
hostDNS:
  enabled: true
  forwardKubeDNSToHost: false
  resolveMemberNames: true
searchDomains:
  disableDefault: true # DHCP provides search domains
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
provisioning:
  diskSelector:
    match: disk.model == "INTEL SSDSC2BB12"
